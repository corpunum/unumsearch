name: CI

on:
  push:
    branches: [main]
    # Docs-only changes (README, docs/, images) skip the 4-OS matrix: Actions minutes are metered.
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ripgrep (equivalence test)
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)
              # The upstream release binary first: the apt mirrors were unresolvable from the
              # runners on 2026-11-11 and each failed attempt cost four minutes. apt is the fallback.
              v=14.1.1
              case "$(uname -m)" in
                x86_64) t=x86_64-unknown-linux-musl ;;
                *) t=aarch64-unknown-linux-gnu ;;
              esac
              if curl -fsSL --retry 3 "https://github.com/BurntSushi/ripgrep/releases/download/$v/ripgrep-$v-$t.tar.gz" | tar xz -C "$RUNNER_TEMP"; then
                sudo install "$RUNNER_TEMP/ripgrep-$v-$t/rg" /usr/local/bin/rg
              else
                sudo apt-get update -q && sudo apt-get install -y -q ripgrep
              fi
              rg --version | head -1 ;;
            macOS) brew install ripgrep ;;
            Windows) choco install ripgrep -y --no-progress ;;
          esac
      - run: cargo test --all-targets
      - run: cargo build --release

  static-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
        run: cargo build --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: unumsearch-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/unumsearch
