<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>How unumsearch works: the search pattern is cut into 3-letter clues, the index says which files hold every clue, only those suspect files are opened, and each is checked line by line against the real file</title>
  <style>
    .h { font-size: 12px; font-weight: 800; letter-spacing: .12em; fill: #93a1bd; }
    .t { font-size: 13px; fill: #e8edf7; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; fill: #e8edf7; }
    .chip { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #0b1020; font-weight: 700; }
    /* 10 s loop: the stages light up left to right and stay */
    .st1 { animation: a1 10s infinite; } .st2 { animation: a2 10s infinite; }
    .st3 { animation: a3 10s infinite; } .st4 { animation: a4 10s infinite; }
    @keyframes a1 { 0% { opacity: .15 } 4%,94% { opacity: 1 } 99%,100% { opacity: .15 } }
    @keyframes a2 { 0%,18% { opacity: .15 } 22%,94% { opacity: 1 } 99%,100% { opacity: .15 } }
    @keyframes a3 { 0%,40% { opacity: .15 } 44%,94% { opacity: 1 } 99%,100% { opacity: .15 } }
    @keyframes a4 { 0%,62% { opacity: .15 } 66%,94% { opacity: 1 } 99%,100% { opacity: .15 } }
    .ok { animation: ok 10s infinite; }
    @keyframes ok { 0%,76% { opacity: 0 } 80%,94% { opacity: 1 } 99%,100% { opacity: 0 } }
  </style>
  <rect width="900" height="300" rx="18" fill="#0b1020"/>

  <!-- 1 the question -->
  <g class="st1">
    <text x="40" y="48" class="h">1 · THE QUESTION</text>
    <rect x="40" y="70" width="170" height="40" rx="8" fill="#1c2540" stroke="#3e63dd"/>
    <text x="125" y="96" text-anchor="middle" class="m">parse_config</text>
    <text x="40" y="140" class="t">an agent's search, often</text>
    <text x="40" y="158" class="t">the same tree all day</text>
  </g>

  <!-- 2 the clues -->
  <g class="st2">
    <text x="250" y="48" class="h">2 · THE CLUES</text>
    <g>
      <rect x="250" y="70" width="44" height="24" rx="6" fill="#f5c542"/><text x="272" y="87" text-anchor="middle" class="chip">par</text>
      <rect x="300" y="70" width="44" height="24" rx="6" fill="#f5c542"/><text x="322" y="87" text-anchor="middle" class="chip">rse</text>
      <rect x="350" y="70" width="44" height="24" rx="6" fill="#f5c542"/><text x="372" y="87" text-anchor="middle" class="chip">e_c</text>
      <rect x="250" y="100" width="44" height="24" rx="6" fill="#f5c542"/><text x="272" y="117" text-anchor="middle" class="chip">con</text>
      <rect x="300" y="100" width="44" height="24" rx="6" fill="#f5c542"/><text x="322" y="117" text-anchor="middle" class="chip">nfi</text>
      <rect x="350" y="100" width="44" height="24" rx="6" fill="#f5c542"/><text x="372" y="117" text-anchor="middle" class="chip">fig</text>
    </g>
    <text x="250" y="152" class="t">every match must contain</text>
    <text x="250" y="170" class="t">these 3-letter pieces</text>
  </g>

  <!-- 3 the index -->
  <g class="st3">
    <text x="440" y="48" class="h">3 · THE INDEX</text>
    <circle cx="500" cy="112" r="44" fill="#3e63dd" fill-opacity=".25" stroke="#3e63dd"/>
    <circle cx="546" cy="112" r="44" fill="#e5484d" fill-opacity=".2" stroke="#e5484d"/>
    <circle cx="523" cy="150" r="44" fill="#30a46c" fill-opacity=".2" stroke="#30a46c"/>
    <circle cx="523" cy="125" r="13" fill="#f5c542"/>
    <text x="440" y="222" class="t">files holding each clue;</text>
    <text x="440" y="240" class="t">only the overlap is a suspect</text>
  </g>

  <!-- 4 the suspects -->
  <g class="st4">
    <text x="660" y="48" class="h">4 · THE SUSPECTS</text>
    <g fill="#f5c542">
      <path d="M660 72 h24 l10 10 v32 h-34 z"/>
      <path d="M710 72 h24 l10 10 v32 h-34 z"/>
      <path d="M760 72 h24 l10 10 v32 h-34 z" fill="#1c2540" stroke="#93a1bd"/>
    </g>
    <text x="660" y="162" class="t">only these are opened and</text>
    <text x="660" y="180" class="t">checked line by line</text>
    <g class="ok">
      <text x="677" y="134" text-anchor="middle" font-size="18" font-weight="800" fill="#30a46c">✓</text>
      <text x="727" y="134" text-anchor="middle" font-size="18" font-weight="800" fill="#30a46c">✓</text>
      <text x="777" y="134" text-anchor="middle" font-size="18" font-weight="800" fill="#e5484d">✗</text>
      <rect x="660" y="200" width="200" height="54" rx="10" fill="#1c2540" stroke="#30a46c"/>
      <text x="760" y="223" text-anchor="middle" class="t" font-weight="700">exact answer</text>
      <text x="760" y="242" text-anchor="middle" style="font-size:12px;fill:#93a1bd">same files as ripgrep</text>
    </g>
  </g>

  <!-- arrows -->
  <g stroke="#93a1bd" stroke-width="2" fill="none" opacity=".6">
    <path d="M218 90 h22"/><path d="M234 84 l6 6 -6 6"/>
    <path d="M404 98 h28"/><path d="M426 92 l6 6 -6 6"/>
    <path d="M596 120 h56"/><path d="M646 114 l6 6 -6 6"/>
  </g>
</svg>
