[package]
name = "unumsearch"
version = "0.1.12"
edition = "2021"
description = "Always-fresh local file and code search: trigram index, ripgrep-compatible corpus, CLI/daemon/JSON-RPC/MCP front-ends"
license = "Apache-2.0"
rust-version = "1.89"
repository = "https://github.com/corpunum/unumsearch"
homepage = "https://github.com/corpunum/unumsearch"
readme = "README.md"
keywords = ["search", "grep", "index", "mcp", "trigram"]
categories = ["command-line-utilities", "development-tools", "filesystem"]
exclude = ["/bench", "/.github", "/docs/media"]

[lib]
name = "unumsearch"
path = "src/lib.rs"

[[bin]]
name = "unumsearch"
path = "src/main.rs"

[dependencies]
ignore = "0.4"
globset = "0.4"
regex = "1"
regex-syntax = "0.8"
memchr = "2"
nucleo-matcher = "0.3"
memmap2 = "0.9"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }
dirs = "6"
tiny_http = "0.12"
lexopt = "0.3"
unum-usage = { version = "0.1", git = "https://github.com/corpunum/unum-usage", rev = "8e521e179066a5f3ae9b7ae3a33ecb1797a9c962" }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
